/*
 * The build for the SMARTCyp tools and the container image that carries them.
 *
 * The image itself is built from the Dockerfile in the repository root, not
 * from here. It used to be generated by the bmuschko 'docker-java-application'
 * plugin from a single 'baseImage' line, which meant the image contents were a
 * side effect of a plugin version and could not be built or inspected without
 * Gradle. 'installDist' now lays out the classpath and the Dockerfile copies
 * it, so 'docker build' is all CI needs.
 */

plugins {
    // Apply the groovy plugin to also add support for Groovy (needed for Spock)
    id 'groovy'

    // Apply the application plugin to add support for building a CLI application in Java.
    // 'installDist' also produces the /app/libs layout the image uses.
    id 'application'
}

repositories {

    // The Idea Consult repository has old versions of CDK that are not in Maven Central
    maven {
        url "https://nexus.ideaconsult.net/content/repositories/thirdparty"
    }

    // Use Maven Central for resolving dependencies.
    mavenCentral()

}

java {
    // Declare the target explicitly. Without this block the compile target
    // silently followed whichever JDK happened to be running Gradle, so the
    // bytecode level depended on the developer's machine rather than on
    // anything recorded here. 21 matches the JRE in the Dockerfile.
    //
    // CDK 1.4.8 predates the module system by a decade, and the worry was that
    // JDK 17+ strong encapsulation would break it. It does not: app/src has no
    // reflection, no setAccessible and no SecurityManager use, and CDK 1.4.8
    // reaches nothing under java.* that is now closed. Verified by running the
    // predictions, not just by compiling them.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {

    implementation 'commons-cli:commons-cli:1.11.0'

    // do not upgrade - this is the version that SMARTCyp uses so we should stick with it.
    // app/src/main/java/smartcyp is vendored SMARTCyp source (see its license.txt)
    // and its scores are only meaningful against the CDK it was written for.
    def cdkSmartCypVersion = '1.4.8'
    implementation "org.openscience.cdk:cdk-core:$cdkSmartCypVersion"
    implementation "org.openscience.cdk:cdk-standard:$cdkSmartCypVersion"
    implementation "org.openscience.cdk:cdk-io:$cdkSmartCypVersion"
    implementation "org.openscience.cdk:cdk-ioformats:$cdkSmartCypVersion"
    implementation "org.openscience.cdk:cdk-nonotify:$cdkSmartCypVersion"
    implementation "org.openscience.cdk:cdk-smiles:$cdkSmartCypVersion"
    implementation("org.openscience.cdk:cdk-smarts:$cdkSmartCypVersion") {
        // excluded a dependencies are not correctly defined and this is not found
        exclude group:'jama',module:'jama'
    }
    implementation "org.openscience.cdk:cdk-valencycheck:$cdkSmartCypVersion"
    implementation("org.openscience.cdk:cdk-extra:$cdkSmartCypVersion")  {
        exclude group:'jama',module:'jama'
    }

    // Groovy 4 for Spock testing. Note the group id: Groovy 4 moved from
    // 'org.codehaus.groovy' to 'org.apache.groovy', and Spock's variant has to
    // match ('-groovy-4.0').
    testImplementation 'org.apache.groovy:groovy:4.0.32'

    // Use the awesome Spock testing and specification framework even with Java
    testImplementation 'org.spockframework:spock-core:2.3-groovy-4.0'

    // Gradle 9 no longer puts the JUnit Platform launcher on the test runtime
    // classpath implicitly; without it every test task fails before running a
    // single spec with 'Failed to load JUnit Platform'. No version: spock-core
    // imports the JUnit BOM, which pins it in step with the engine Spock uses.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    // Define the main class for the application.
    // this can be set as a commandline option e.g.
    // ./gradlew run --args="--help" -PmainClass=squonk.jobs.smartcyp.Predictor
    //  ./gradlew run --args="-i ../data/dhfr_3d.sdf -a" -PmainClass=squonk.jobs.smartcyp.Predictor
    mainClass = project.hasProperty("mainClass") ? project.getProperty("mainClass") : 'squonk.jobs.smartcyp.Predictor'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
